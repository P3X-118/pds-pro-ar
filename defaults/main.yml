---
# PDS-Pro Ansible Role Defaults
#
# PDS-Pro is the SGC web admin UX that wraps `goat pds admin` with operator
# OAuth (Okta primary; Google, Microsoft, Facebook, X via goth). One PDS-Pro
# instance fronts multiple PDS instances.

pds_pro_enabled: false

pds_pro_identifier: "{{ service_id_prefix }}pds-pro"

pds_pro_base_path: "{{ sgc_playbook_base_path }}/{{ service_directory_prefix }}pds-pro"
pds_pro_etc_path: "{{ pds_pro_base_path }}/etc"
pds_pro_secrets_path: "{{ pds_pro_etc_path }}/secrets"
pds_pro_state_path: "{{ pds_pro_base_path }}/state"

pds_pro_uid: "{{ sgc_playbook_uid }}"
pds_pro_gid: "{{ sgc_playbook_gid }}"

# Container image
pds_pro_container_image: "docker.io/legitservices/pds-pro:0.1.0"
pds_pro_container_image_self_build: false

# Network
pds_pro_container_network: "{{ pds_pro_identifier }}"
pds_pro_container_additional_networks: []

# Extra raw `docker create` arguments (each a separate list item), inserted
# verbatim. Use for site-specific needs such as --add-host to resolve an
# externally-named IdP back through the host (OIDC hairpin-NAT workaround).
pds_pro_container_extra_arguments: []

pds_pro_container_additional_networks_auto: |
  {{
    ([revproxy_service_networks] if revproxy_service_networks else [])
  }}

# Listen
pds_pro_listen_addr: ":8080"
pds_pro_hostname: ""
pds_pro_base_url: "https://{{ pds_pro_hostname }}"

# Traefik
pds_pro_container_labels_traefik_enabled: "{{ traefik_labels_enabled | default(true) }}"
pds_pro_container_labels_traefik_docker_network: "{{ revproxy_service_networks }}"
# role-specific:traefik
pds_pro_container_labels_traefik_entrypoints: "{{ traefik_entrypoint_primary }}"
pds_pro_container_labels_traefik_tls_certResolver: "{{ traefik_certResolver_primary }}"
pds_pro_container_labels_traefik_rule: "Host(`{{ pds_pro_hostname }}`)"
# /role-specific:traefik

pds_pro_container_labels_traefik_additional_labels: []

# Session — secret derived from sgc_pgsk so it's stable across restarts and
# reinstalls without being checked into source.
pds_pro_session_secret: "{{ (sgc_pgsk ~ 'pds.pro.session') | hash('sha512') }}"
pds_pro_session_secure: true
pds_pro_session_max_age_sec: 86400

# OAuth providers — only enabled providers are rendered into config.yaml.
# Each provider's client_secret is written to a separate file with mode 0600.

# Generic OpenID Connect provider (e.g. self-hosted Authentik). Endpoints are
# resolved via OIDC discovery on issuer_url + /.well-known/openid-configuration,
# so no vendor-specific URL scheme is required. Callback: <base>/auth/oidc/callback.
pds_pro_oauth_oidc_enabled: false
pds_pro_oauth_oidc_issuer_url: ""
pds_pro_oauth_oidc_client_id: ""
pds_pro_oauth_oidc_client_secret: ""
pds_pro_oauth_oidc_scopes: ["openid", "profile", "email"]

# The Okta client secret has no derivation (it's externally minted), so
# operators must supply it via group_vars / vault.
pds_pro_oauth_okta_enabled: false
pds_pro_oauth_okta_org_url: ""
pds_pro_oauth_okta_client_id: ""
pds_pro_oauth_okta_client_secret: ""

pds_pro_oauth_google_enabled: false
pds_pro_oauth_google_client_id: ""
pds_pro_oauth_google_client_secret: ""
pds_pro_oauth_google_scopes: ["email", "profile"]

pds_pro_oauth_microsoft_enabled: false
pds_pro_oauth_microsoft_client_id: ""
pds_pro_oauth_microsoft_client_secret: ""

pds_pro_oauth_facebook_enabled: false
pds_pro_oauth_facebook_client_id: ""
pds_pro_oauth_facebook_client_secret: ""
pds_pro_oauth_facebook_scopes: ["email"]

pds_pro_oauth_twitter_enabled: false
pds_pro_oauth_twitter_client_id: ""
pds_pro_oauth_twitter_client_secret: ""

# Operator allowlist. Each entry has subject (provider|user-id), email,
# email_domain, and roles. First match wins.
pds_pro_allowlist: []

# Managed PDS instances. Each entry: { name, pds_host, admin_password }.
# admin_password should match the value derived in the pds-ar role for the
# corresponding instance — typically:
#   "{{ '%s' | format(sgc_pgsk) | password_hash('sha512', 'pds.admin.<instance>', rounds=655555) | to_uuid }}"
pds_pro_instances: []

# --- Cross-auth federation (atproto <-> Authentik), optional -----------------
# When enabled, pds-pro provisions <handle>.<handle_domain> atproto accounts for
# Authentik-authed users (the /claim flow) and links the DID/handle back onto the
# Authentik user. See the pds-pro repo's CLAUDE.md "Cross-auth federation".
pds_pro_atproto_enabled: false
# Must match a pds_pro_instances[].name — the PDS that hosts claimed accounts.
pds_pro_atproto_instance: ""
# BARE, user-facing handle domain (drop any pds./bsky. service prefix the PDS
# host carries): cooey.club -> handles render as <user>.cooey.club.
pds_pro_atproto_handle_domain: ""

# Authentik group whose members are auto-provisioned an atproto account. REQUIRED
# on a shared Authentik (cooey shares it with other brands) — empty means the
# sweep provisions nobody (safe). Users join by authorizing a cooey application.
pds_pro_atproto_member_group: ""
# Secret pds-pro derives per-account managed passwords from (so it can broker
# atproto sessions/app-passwords). Derived from sgc_pgsk; never user-facing.
pds_pro_atproto_managed_secret: "{{ '%s' | format(sgc_pgsk) | password_hash('sha512', 'pds.pro.managed', rounds=655555) | to_uuid }}"

# Webhook shared secret: authenticates the Authentik user-creation notification
# that nudges a real-time provisioning sweep (POST /hooks/authentik), so an
# account is created the moment a user appears via ANY door (Discord/chat/bsky).
# The SAME value is configured on the Authentik notification transport
# (provision-atproto-webhook.py, env PDS_PRO_WEBHOOK_SECRET).
pds_pro_atproto_webhook_secret: "{{ '%s' | format(sgc_pgsk) | password_hash('sha512', 'pds.pro.hook', rounds=655555) | to_uuid }}"

# Broker shared secret: authenticates the internal atproto session-broker endpoint
# (POST /internal/atproto-session) that chat (delta) calls server-to-server over
# the shared host docker network to embed Bluesky for an already-authenticated
# cooey user (no second login). Derived from sgc_pgsk; the SAME value must be
# configured on the stoked/delta side (stoked_pds_pro_broker_secret, same salt).
pds_pro_atproto_broker_secret: "{{ '%s' | format(sgc_pgsk) | password_hash('sha512', 'pds.pro.broker', rounds=655555) | to_uuid }}"

# Authentik API — pds-pro PATCHes attributes.atproto onto users. The token is
# derived from sgc_pgsk; the SAME value must be provisioned as the
# svc-pds-pro-atproto-writer token (provision-atproto-writer-token.py uses
# env PDS_PRO_AUTHENTIK_TOKEN; keep this salt in lockstep).
pds_pro_authentik_base_url: ""
pds_pro_authentik_token: "{{ '%s' | format(sgc_pgsk) | password_hash('sha512', 'pds.pro.aktoken', rounds=655555) | to_uuid }}"

# ntfy alert on a (non-blocking) provisioning failure. Optional.
pds_pro_ntfy_base_url: ""
pds_pro_ntfy_topic: ""
pds_pro_ntfy_token: ""

# End-user claim OIDC client (cooey brand, NOT the operator login). The
# client_secret is derived from sgc_pgsk; the SAME value must be provisioned via
# provision-pds-pro-claim.py (env PDS_PRO_CLAIM_OIDC_SECRET). callback is forced
# to <base_url>/claim/callback in the template.
pds_pro_atproto_claim_issuer_url: ""
pds_pro_atproto_claim_client_id: "pds-pro-claim"
pds_pro_atproto_claim_client_secret: "{{ '%s' | format(sgc_pgsk) | password_hash('sha512', 'pds.pro.claim', rounds=655555) | to_uuid }}"
pds_pro_atproto_claim_scopes: ["openid", "profile", "email"]

# Audit log
pds_pro_audit_db_filename: "audit.db"
pds_pro_audit_db_path: "{{ pds_pro_state_path }}/{{ pds_pro_audit_db_filename }}"

# Systemd
pds_pro_systemd_required_services_list: "{{ [sysd_docker_service] if sysd_docker_service else [] }}"
pds_pro_systemd_wanted_services_list: []
pds_pro_systemd_required_services_list_auto: "{{ [] }}"
pds_pro_systemd_wanted_services_list_auto: |
  {{
    ([(exim_relay_identifier | default('sgc-exim-relay')) ~ '.service'] if exim_relay_enabled | default(false) else [])
  }}
